version: '3.8'

services:
  app:
    build: .
    container_name: hrm_app
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_USER=hrm_user
      - DB_PASS=hrm_password
      - DB_NAME=hrm_db
    depends_on:
      - db

  db:
    image: mariadb:10.5
    container_name: hrm_db
    restart: always
    security_opt:
      - seccomp:unconfined
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=hrm_db
      - MYSQL_USER=hrm_user
      - MYSQL_PASSWORD=hrm_password
    volumes:
      - database_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  database_data:
